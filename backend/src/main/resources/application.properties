spring.application.name=enviro-withdrawals
server.port=8080

# Profiles: "dev" (the default) adds demo data, the H2 console and Swagger UI; "prod" switches them off.
spring.profiles.default=dev

# --- Database: in-memory H2 (data is recreated on every start) ---
spring.datasource.url=jdbc:h2:mem:enviro;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Hibernate creates the tables from the entities. Fine for an in-memory demo; a real system would use
# versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=create-drop
# Keep database access inside the service layer's transactions, not open for the whole web request.
spring.jpa.open-in-view=false

# Return RFC 9457 Problem Details for Spring's built-in errors too (e.g. 404 for an unknown URL).
spring.mvc.problemdetails.enabled=true

# --- Session cookie hardening ---
# HttpOnly: JavaScript cannot read the session id, which limits the damage an XSS bug could do.
server.servlet.session.cookie.http-only=true
# SameSite=Strict: the browser never sends the cookie with requests started by other sites (CSRF defence in depth).
server.servlet.session.cookie.same-site=strict
# Idle sessions expire after 30 minutes.
server.servlet.session.timeout=30m
# Never put the session id in URLs.
server.servlet.session.tracking-modes=cookie

# --- Developer tools: off unless a profile switches them on ---
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.seed.enabled=false

# --- Brute-force protection: lock a username for 15 minutes after 5 failed sign-ins ---
app.security.login.max-failures=5
app.security.login.lock-minutes=15

app.cors.allowed-origins=http://localhost:5173
