# Development profile (active by default). These settings are for local development only.

# H2 web console: http://localhost:8080/h2-console (staff sign-in required; JDBC URL jdbc:h2:mem:enviro, user sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API docs: http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
# Swagger UI reads the XSRF-TOKEN cookie and sends it back, so "Try it out" works for POST requests.
springdoc.swagger-ui.csrf.enabled=true
# Document Spring Security's sign-in endpoint too.
springdoc.show-login-endpoint=true

# Demo investors, products and sign-in accounts (see DataSeeder). The password is for demo data only.
app.seed.enabled=true
app.seed.demo-password=Enviro365!
